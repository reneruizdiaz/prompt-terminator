<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Prompt Terminator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Rajdhani:wght@400;500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
:root {
  color-scheme: dark;
  --void:#000000; --panel:rgba(255,31,31,0.035); --panel-hot:rgba(255,31,31,0.07);
  --line:#3a0d0d; --line-mid:#6a1414; --red:#ff1f1f;
  --chrome:#e8e8e8; --steel:#a7a7a7; --text:#efe7e7; --muted:#b29e9e;
  --display:'Bebas Neue', Impact, 'Arial Narrow', sans-serif;
  --body:'Rajdhani', 'Segoe UI', system-ui, sans-serif;
  --mono:'Share Tech Mono', ui-monospace, Menlo, Consolas, monospace;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
html{ background:var(--void); scroll-padding-top:calc(env(safe-area-inset-top,0px) + 64px); }
*,*::before,*::after{ box-sizing:border-box; margin:0; padding:0; }
body{ background:var(--void); color:var(--text); font-family:var(--body); font-size:17px; line-height:1.55; min-height:100%; overflow-x:hidden; }
body::before{ content:""; position:fixed; inset:0 0 auto; height:env(safe-area-inset-top,0px); z-index:30; background:rgba(0,0,0,0.88); }
button{ font:inherit; color:inherit; background:none; border:none; cursor:pointer; }
button:focus-visible, textarea:focus-visible, input:focus-visible{ outline:2px solid var(--red); outline-offset:2px; }
.bar{ position:sticky; top:env(safe-area-inset-top,0px); z-index:20; display:flex; align-items:center; gap:10px; padding:10px 16px; background:rgba(0,0,0,0.88); backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px); border-bottom:1px solid var(--line); }
.brand{ font-family:var(--display); font-size:20px; letter-spacing:.12em; color:var(--chrome); margin-right:auto; white-space:nowrap; min-width:0; overflow:hidden; }
.brand b{ color:var(--red); font-weight:normal; }
.icon-btn{ flex-shrink:0; height:36px; min-width:36px; padding:0 10px; border:1px solid var(--line-mid); color:var(--muted); display:inline-flex; align-items:center; justify-content:center; gap:6px; font-family:var(--mono); font-size:12px; }
.icon-btn[aria-pressed="true"]{ color:var(--red); border-color:var(--red); box-shadow:0 0 14px rgba(255,31,31,.35); }
.icon-btn svg{ width:18px; height:18px; flex-shrink:0; }
.count{ color:var(--red); }
.hero{ position:relative; padding:28px 16px 8px; text-align:center; overflow:hidden; }
.grid-floor{ position:absolute; left:-50%; right:-50%; bottom:-10px; height:56%; pointer-events:none; background-image:linear-gradient(rgba(255,31,31,.28) 1px, transparent 1px), linear-gradient(90deg, rgba(255,31,31,.28) 1px, transparent 1px); background-size:48px 48px; transform:perspective(380px) rotateX(64deg); transform-origin:bottom; -webkit-mask-image:linear-gradient(to top, #000 0%, transparent 85%); mask-image:linear-gradient(to top, #000 0%, transparent 85%); opacity:.55; }
.eye-wrap{ position:relative; width:min(84vw, 400px); aspect-ratio:1; margin:0 auto; }
#eye{ width:100%; height:100%; overflow:visible; }
.readout{ position:absolute; font-family:var(--mono); font-size:11px; color:var(--muted); letter-spacing:.08em; text-align:left; line-height:1.5; }
.readout.l{ left:-6px; top:8%; } .readout.r{ right:-6px; bottom:10%; text-align:right; }
.readout em{ font-style:normal; color:var(--red); }
.title{ position:relative; font-family:var(--display); font-weight:normal; line-height:.9; margin-top:6px; }
.title .t1{ display:block; font-size:clamp(20px,5vw,26px); letter-spacing:.5em; color:var(--red); text-shadow:0 0 14px rgba(255,31,31,.6); padding-left:.5em; }
.title .t2{ display:block; font-size:clamp(40px,12.2vw,112px); letter-spacing:.03em; padding:0 .05em; background:linear-gradient(180deg,#ffffff 0%,#d9d9d9 42%,#6f6f6f 52%,#e6e6e6 64%,#9a9a9a 100%); -webkit-background-clip:text; background-clip:text; color:transparent; filter:drop-shadow(0 2px 0 #000) drop-shadow(0 0 18px rgba(255,31,31,.25)); }
.sub{ position:relative; color:var(--muted); font-size:17px; max-width:34ch; margin:12px auto 0; }
.ring-a{ transform-origin:0 0; animation:spin 40s linear infinite; }
.ring-b{ transform-origin:0 0; animation:spin 28s linear infinite reverse; }
.ring-c{ transform-origin:0 0; animation:spin 70s linear infinite; }
.iris{ transform-origin:0 0; transition:transform .8s cubic-bezier(.2,.9,.2,1); }
.glow{ transition:opacity .6s; }
.boot{ stroke-dasharray:1200; stroke-dashoffset:1200; animation:draw 1.8s .2s cubic-bezier(.6,0,.2,1) forwards; }
#eye[data-state="scan"] .ring-a{ animation-duration:6s; } #eye[data-state="scan"] .ring-b{ animation-duration:4s; }
#eye[data-state="scan"] .iris{ transform:scale(.86); }
#eye[data-state="ask"] .iris{ transform:scale(.94); }
#eye[data-state="terminate"] .ring-a{ animation-duration:1.6s; } #eye[data-state="terminate"] .ring-b{ animation-duration:1.1s; } #eye[data-state="terminate"] .ring-c{ animation-duration:5s; }
#eye[data-state="terminate"] .iris{ transform:scale(1.18); animation:throb .5s ease-in-out infinite alternate; }
#eye[data-state="terminate"] .glow{ opacity:1; }
#eye[data-state="exec"] .ring-a{ animation-duration:8s; } #eye[data-state="exec"] .iris{ transform:scale(1.05); }
#eye[data-state="lock"] .ring-a, #eye[data-state="lock"] .ring-b, #eye[data-state="lock"] .ring-c{ animation-play-state:paused; }
#eye[data-state="lock"] .lockmark{ opacity:1; }
.lockmark{ opacity:0; transition:opacity .4s; }
@keyframes spin{ to{ transform:rotate(360deg); } }
@keyframes draw{ to{ stroke-dashoffset:0; } }
@keyframes throb{ from{ filter:brightness(1); } to{ filter:brightness(1.5); } }
main{ max-width:860px; margin:0 auto; padding:8px 16px 96px; position:relative; }
.section{ margin-top:28px; }
.section[hidden]{ display:none; }
.label{ font-family:var(--display); font-size:22px; letter-spacing:.1em; color:var(--chrome); display:flex; align-items:center; gap:12px; margin-bottom:12px; }
.label::after{ content:""; flex:1; height:1px; background:linear-gradient(90deg,var(--line-mid),transparent); }
.label .n{ color:var(--red); }
.hint{ color:var(--muted); font-size:15px; margin:-4px 0 12px; }
.profiles{ display:grid; grid-template-columns:repeat(4,1fr); gap:6px; margin-bottom:12px; }
.prof{ border:1px solid var(--line); padding:10px 6px; text-align:center; font-weight:600; font-size:15px; line-height:1.2; color:var(--muted); background:rgba(255,255,255,.01); }
.prof[aria-pressed="true"]{ border-color:var(--red); color:var(--text); background:var(--panel-hot); box-shadow:inset 0 -2px 0 var(--red); }
.rules-link{ font-size:14px; color:var(--muted); text-decoration:underline; text-underline-offset:3px; margin-bottom:10px; display:inline-block; }
textarea{ width:100%; background:#050000; border:1px solid var(--line-mid); border-left:3px solid var(--red); color:var(--text); padding:14px 16px; font:17px/1.55 var(--body); resize:vertical; min-height:120px; caret-color:var(--red); }
textarea::placeholder{ color:#7d6a6a; }
textarea.small{ min-height:72px; border-left-color:var(--line-mid); }
.actions{ display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-top:14px; }
.btn{ font-family:var(--display); font-size:21px; letter-spacing:.12em; padding:12px 26px; background:var(--red); color:#000; box-shadow:0 0 28px rgba(255,31,31,.45); clip-path:polygon(10px 0,100% 0,calc(100% - 10px) 100%,0 100%); }
.btn:disabled{ background:#2a0a0a; color:#6d4040; box-shadow:none; cursor:not-allowed; }
.btn.alt{ background:transparent; color:var(--red); box-shadow:inset 0 0 0 1px var(--red); }
.btn.alt:disabled{ color:#6d4040; box-shadow:inset 0 0 0 1px #3a0d0d; }
.link{ color:var(--muted); font-size:15px; text-decoration:underline; text-underline-offset:3px; }
.err{ color:#ff6b6b; font-size:15px; }
.kbd{ font-family:var(--mono); font-size:12px; color:#7d6a6a; }
.q{ border:1px solid var(--line); background:var(--panel); padding:16px; margin-bottom:10px; }
.q-t{ font-weight:700; font-size:18px; line-height:1.4; display:flex; gap:10px; }
.q-t span{ color:var(--red); font-family:var(--mono); font-size:13px; margin-top:4px; }
.q-why{ color:var(--muted); font-size:14px; margin:4px 0 10px 32px; }
.chips{ display:flex; flex-wrap:wrap; gap:6px; margin:0 0 10px 32px; }
.chip{ border:1px solid var(--line-mid); padding:6px 12px; font-size:15px; color:var(--text); background:#080202; text-align:left; line-height:1.3; }
.chip[aria-pressed="true"]{ border-color:var(--red); background:rgba(255,31,31,.16); }
.q textarea{ min-height:56px; border-left-color:var(--line-mid); font-size:16px; }
.read{ font-family:var(--mono); font-size:13px; color:var(--muted); border-left:2px solid var(--red); padding:4px 10px; margin-bottom:14px; }
.read em{ font-style:normal; color:var(--red); }
.working{ text-align:center; padding:26px 12px; border:1px solid var(--red); background:var(--panel-hot); }
.working[hidden]{ display:none; }
.working .w1{ font-family:var(--display); font-size:28px; letter-spacing:.2em; color:var(--red); }
.working .w2{ font-family:var(--mono); font-size:12px; color:var(--muted); margin-top:4px; letter-spacing:.1em; }
.bars{ display:flex; gap:3px; justify-content:center; margin-top:14px; height:18px; align-items:flex-end; }
.bars i{ width:4px; background:var(--red); animation:bar .9s ease-in-out infinite alternate; }
@keyframes bar{ from{ height:3px; opacity:.4; } to{ height:18px; opacity:1; } }
.versions{ display:flex; gap:6px; margin-bottom:12px; flex-wrap:wrap; }
.ver{ font-family:var(--mono); font-size:13px; padding:5px 10px; border:1px solid var(--line); color:var(--muted); }
.ver[aria-pressed="true"]{ border-color:var(--red); color:var(--red); }
.ba{ display:grid; grid-template-columns:1fr; gap:10px; }
@media (min-width:760px){ .ba{ grid-template-columns:minmax(0,1fr) minmax(0,1.7fr); } }
.pane{ border:1px solid var(--line); background:#040000; padding:16px; min-width:0; }
.pane h4{ font-family:var(--display); font-weight:normal; font-size:18px; letter-spacing:.12em; margin-bottom:8px; color:var(--steel); display:flex; justify-content:space-between; align-items:baseline; }
.pane.after{ border-color:var(--red); box-shadow:0 0 36px rgba(255,31,31,.12); }
.pane.after h4{ color:var(--red); }
.pane h4 small{ font-family:var(--mono); font-size:11px; letter-spacing:.06em; color:var(--muted); }
.before-txt{ color:var(--muted); white-space:pre-wrap; word-break:break-word; font-size:16px; }
.prompt-txt{ font-family:var(--mono); font-size:13.5px; line-height:1.75; color:#f1dede; white-space:pre-wrap; word-break:break-word; max-height:62vh; overflow:auto; }
.why{ color:var(--muted); font-size:15px; margin-top:12px; padding-left:12px; border-left:2px solid var(--line-mid); }
.out{ border:1px solid var(--line-mid); background:#040000; padding:16px; white-space:pre-wrap; word-break:break-word; font-size:16px; line-height:1.6; max-height:70vh; overflow:auto; }
.out.empty{ color:var(--muted); }
.scrim{ position:fixed; inset:0; background:rgba(0,0,0,.7); z-index:40; }
.scrim[hidden], .sheet[hidden]{ display:none; }
.sheet{ position:fixed; z-index:41; right:0; top:0; bottom:0; width:min(480px,100vw); background:#050000; border-left:1px solid var(--red); padding:calc(env(safe-area-inset-top,0px) + 16px) 16px calc(env(safe-area-inset-bottom,0px) + 16px); display:flex; flex-direction:column; gap:12px; box-shadow:-20px 0 60px rgba(255,31,31,.15); }
.sheet-h{ display:flex; align-items:center; gap:10px; }
.sheet-h h3{ font-family:var(--display); font-weight:normal; font-size:28px; letter-spacing:.1em; color:var(--red); margin-right:auto; }
.search{ width:100%; background:#000; border:1px solid var(--line-mid); color:var(--text); padding:10px 12px; font:16px var(--body); }
.list{ overflow:auto; flex:1; display:flex; flex-direction:column; gap:8px; }
.item{ border:1px solid var(--line); padding:12px; background:var(--panel); text-align:left; width:100%; cursor:pointer; }
.item:hover{ border-color:var(--line-mid); }
.item b{ display:block; font-size:17px; line-height:1.3; }
.item small{ font-family:var(--mono); font-size:11px; color:var(--muted); }
.item .row{ display:flex; gap:8px; align-items:center; margin-top:6px; }
.tag{ font-family:var(--mono); font-size:11px; color:var(--red); border:1px solid var(--line-mid); padding:1px 6px; }
.del{ margin-left:auto; color:var(--muted); font-size:13px; text-decoration:underline; }
.empty-list{ color:var(--muted); padding:24px 4px; }
.sheet textarea{ flex:1; min-height:200px; font-size:15px; }
.toast{ position:fixed; left:50%; bottom:calc(env(safe-area-inset-bottom,0px) + 20px); transform:translateX(-50%); background:var(--red); color:#000; font-family:var(--display); letter-spacing:.12em; font-size:18px; padding:8px 18px; z-index:60; opacity:0; transition:opacity .25s; pointer-events:none; }
.toast.on{ opacity:1; }
footer{ text-align:center; margin-top:56px; padding-top:22px; border-top:1px solid var(--line); display:flex; flex-direction:column; align-items:center; gap:8px; }
footer .credit{ font-family:var(--display); font-size:22px; letter-spacing:.14em; color:var(--chrome); }
footer .ig{ display:inline-flex; align-items:center; gap:8px; color:var(--red); font-family:var(--mono); font-size:14px; letter-spacing:.06em; text-decoration:none; padding:6px 12px; border:1px solid var(--line-mid); }
footer .ig:hover{ border-color:var(--red); box-shadow:0 0 14px rgba(255,31,31,.3); }
footer .ig svg{ width:18px; height:18px; }
footer .meta{ font-family:var(--mono); font-size:11px; color:#6d5555; letter-spacing:.1em; }
@media (max-width:520px){ .profiles{ grid-template-columns:repeat(2,1fr); } .readout{ display:none; } .chips, .q-why{ margin-left:0; } .brand{ font-size:17px; letter-spacing:.06em; } .bar{ gap:6px; padding:10px 12px; } .ars-l{ display:none; } }
@media (max-width:380px){ .brand{ font-size:14.5px; letter-spacing:.04em; } .icon-btn{ padding:0 8px; } }
@media (prefers-reduced-motion: reduce){ .ring-a,.ring-b,.ring-c,.bars i,#eye[data-state] .iris{ animation:none !important; } .boot{ stroke-dashoffset:0; animation:none; } }
</style>
</head>
<body>
<div class="bar">
  <div class="brand"><b>PROMPT</b> TERMINATOR</div>
  <button class="icon-btn" id="soundBtn" aria-pressed="false" aria-label="Sonido"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 9h4l5-4v14l-5-4H4z"/><path id="waves" d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12" opacity=".35"/></svg></button>
  <button class="icon-btn" id="langBtn" aria-label="Idioma">ES</button>
  <button class="icon-btn" id="arsenalBtn" aria-label="Arsenal"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="4" y="5" width="16" height="4"/><rect x="4" y="10" width="16" height="4"/><rect x="4" y="15" width="16" height="4"/></svg><span class="ars-l" data-i="arsenal">ARSENAL</span> <span class="count" id="count">0</span></button>
</div>
<header class="hero">
  <div class="grid-floor" aria-hidden="true"></div>
  <div class="eye-wrap">
    <svg id="eye" data-state="idle" viewBox="-200 -200 400 400" aria-hidden="true">
      <defs>
        <radialGradient id="gIris" cx="0" cy="0" r="1" gradientUnits="objectBoundingBox" fx=".42" fy=".4"><stop offset="0" stop-color="#fff7d6"/><stop offset=".12" stop-color="#ffb347"/><stop offset=".3" stop-color="#ff2a0a"/><stop offset=".62" stop-color="#9e0000"/><stop offset="1" stop-color="#1a0000"/></radialGradient>
        <radialGradient id="gGlow"><stop offset="0" stop-color="#ff1f1f" stop-opacity=".7"/><stop offset="1" stop-color="#ff1f1f" stop-opacity="0"/></radialGradient>
        <linearGradient id="gSteel" x1="0" y1="-1" x2="0" y2="1" gradientUnits="objectBoundingBox"><stop offset="0" stop-color="#d0d0d0"/><stop offset=".45" stop-color="#3c3c3c"/><stop offset=".55" stop-color="#1a1a1a"/><stop offset="1" stop-color="#8a8a8a"/></linearGradient>
        <filter id="fBlur"><feGaussianBlur stdDeviation="6"/></filter>
      </defs>
      <circle r="190" fill="url(#gGlow)" class="glow" opacity=".45"/>
      <g class="ring-c"><circle r="186" fill="none" stroke="#4a0f0f" stroke-width="1" stroke-dasharray="2 6"/></g>
      <g class="ring-a" id="ticks"></g>
      <circle r="160" fill="none" stroke="#ff1f1f" stroke-width="1.2" class="boot" opacity=".75"/>
      <g class="ring-b"><circle r="146" fill="none" stroke="#ff1f1f" stroke-width="6" stroke-dasharray="60 24 14 24 90 40" opacity=".55"/></g>
      <g stroke="#ff1f1f" stroke-width="1" opacity=".6"><line x1="-198" y1="0" x2="-168" y2="0"/><line x1="168" y1="0" x2="198" y2="0"/><line x1="0" y1="-198" x2="0" y2="-168"/><line x1="0" y1="168" x2="0" y2="198"/></g>
      <circle r="122" fill="url(#gSteel)" stroke="#000" stroke-width="3"/>
      <circle r="110" fill="#050000" stroke="#2a2a2a" stroke-width="2"/>
      <g class="iris">
        <circle r="96" fill="#ff1f1f" opacity=".45" filter="url(#fBlur)"/>
        <circle r="84" fill="url(#gIris)"/>
        <circle r="84" fill="none" stroke="#000" stroke-width="2" stroke-dasharray="1 5" opacity=".6"/>
        <circle r="56" fill="none" stroke="#ffb347" stroke-width=".6" opacity=".5"/>
        <circle r="22" fill="#fff4d0" opacity=".9"/>
        <circle r="9" fill="#ffffff"/>
        <ellipse cx="-30" cy="-34" rx="16" ry="9" fill="#ffffff" opacity=".25" transform="rotate(-35 -30 -34)"/>
      </g>
      <g class="lockmark" stroke="#ff1f1f" stroke-width="3" fill="none"><path d="M-150 -120 v-30 h30 M150 -120 v-30 h-30 M-150 120 v30 h30 M150 120 v30 h-30"/></g>
    </svg>
    <div class="readout l" id="roL"></div>
    <div class="readout r" id="roR"></div>
  </div>
  <h1 class="title"><span class="t1" data-i="unit">UNIDAD 5.0</span><span class="t2">PROMPT TERMINATOR</span></h1>
  <p class="sub" data-i="sub"></p>
</header>
<main>
  <section class="section" id="sMission">
    <div class="label"><span class="n">01</span><span data-i="mission"></span></div>
    <div class="profiles" id="profiles" role="group" aria-label="Modo"></div>
    <button class="rules-link" id="rulesBtn" data-i="rulesLink"></button>
    <textarea id="task" maxlength="6000"></textarea>
    <div class="actions">
      <button class="btn" id="goBtn" disabled data-i="go"></button>
      <button class="link" id="directBtn" data-i="direct"></button>
      <span class="kbd">⌘/Ctrl + Enter</span>
    </div>
    <p class="err" id="err1"></p>
  </section>
  <div class="section working" id="working" hidden role="status">
    <div class="w1" id="wTitle"></div>
    <div class="w2">NEURAL NET PROCESSOR ONLINE</div>
    <div class="bars" aria-hidden="true"><i></i><i style="animation-delay:.1s"></i><i style="animation-delay:.2s"></i><i style="animation-delay:.3s"></i><i style="animation-delay:.15s"></i><i style="animation-delay:.05s"></i><i style="animation-delay:.25s"></i></div>
  </div>
  <section class="section" id="sAsk" hidden>
    <div class="label"><span class="n">02</span><span data-i="interrogation"></span></div>
    <div class="read" id="readLine"></div>
    <div id="qs"></div>
    <div class="actions"><button class="btn" id="buildBtn" data-i="terminate"></button><button class="link" id="backBtn" data-i="back"></button></div>
    <p class="err" id="err2"></p>
  </section>
  <section class="section" id="sResult" hidden>
    <div class="label"><span class="n">03</span><span data-i="acquired"></span></div>
    <div class="versions" id="versions"></div>
    <div class="ba">
      <div class="pane"><h4><span data-i="before"></span><small id="beforeCount"></small></h4><div class="before-txt" id="beforeTxt"></div></div>
      <div class="pane after"><h4><span data-i="after"></span><small id="afterCount"></small></h4><div class="prompt-txt" id="promptTxt"></div><div class="why" id="whyTxt"></div></div>
    </div>
    <div class="actions">
      <button class="btn" id="execBtn" data-i="execute"></button>
      <button class="btn alt" id="copyBtn" data-i="copy"></button>
      <button class="btn alt" id="saveBtn" data-i="save"></button>
      <button class="link" id="newBtn" data-i="newMission"></button>
    </div>
    <div class="section" id="sExec" hidden>
      <div class="label"><span class="n">04</span><span data-i="output"></span></div>
      <div class="out empty" id="out"></div>
      <div class="actions"><button class="btn alt" id="stopBtn" hidden data-i="stop"></button><button class="link" id="copyOutBtn" hidden data-i="copyOut"></button></div>
    </div>
    <div class="section">
      <div class="label"><span class="n">05</span><span data-i="refine"></span></div>
      <p class="hint" data-i="refineHint"></p>
      <textarea class="small" id="refineTxt"></textarea>
      <div class="actions"><button class="btn alt" id="refineBtn" disabled data-i="reterminate"></button></div>
      <p class="err" id="err3"></p>
    </div>
  </section>
